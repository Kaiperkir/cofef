version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: coffee_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Скрипты инициализации БД запускаются только при первом создании тома
      - ./backend/migrations/000001_init_schema.up.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: coffee_backend
    environment:
      - ENV=dev
      - DATABASE_URL=postgres://postgres:1234@db:5432/postgres?sslmode=disable
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "5000:5000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: .
    container_name: coffee_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
